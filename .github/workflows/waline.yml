name: Check Waline service
on:
  push:
    branches: [main]
    paths:
      - 'services/waline/**'
      - '.github/workflows/waline.yml'
  pull_request:
    paths:
      - 'services/waline/**'
      - '.github/workflows/waline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: services/waline/package-lock.json
      - run: npm ci --prefix services/waline --ignore-scripts --no-audit --no-fund
      - run: node services/waline/test/registration-guard.test.cjs
      - run: node --test services/waline/test/sql-model.test.cjs
      - run: node --test services/waline/test/site-stats.test.cjs
