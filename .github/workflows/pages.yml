name: Publish blog to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    env:
      PUBLIC_SITE_URL: https://Alinerml.github.io
      ASTRO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Configure optional comment service
        if: vars.PUBLIC_WALINE_SERVER_URL != ''
        env:
          COMMENT_SERVICE_URL: ${{ vars.PUBLIC_WALINE_SERVER_URL }}
        run: printf 'PUBLIC_WALINE_SERVER_URL=%s\n' "$COMMENT_SERVICE_URL" >> "$GITHUB_ENV"
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run verify
      - name: Check Waline public registration guard
        run: node services/waline/test/registration-guard.test.cjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
